name: Python source release
on:
  push:
    tags: ['v*']
jobs:
  source-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: zip -r PhishGuard-Python.zip . -x '*/__pycache__/*' '*.pyc' '.git/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: PhishGuard-Python.zip
