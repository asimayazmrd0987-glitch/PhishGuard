name: Python CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quality tools
        run: python -m pip install ruff build
      - name: Lint for syntax and undefined names
        run: ruff check .
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install wheel and smoke-test the entry point
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          phishguard --version
          phishguard data validate --json
          phishguard scan "https://paypa1.com/signin" --json --no-history --fail-on high || test $? -eq 1
