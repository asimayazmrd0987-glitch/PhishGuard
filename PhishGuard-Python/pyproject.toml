[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "1.0.0"
description = "Explainable local phishing and scam-message risk analyzer"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "PhishGuard project"}]
dependencies = []

[tool.setuptools]
packages = ["phishguard"]
