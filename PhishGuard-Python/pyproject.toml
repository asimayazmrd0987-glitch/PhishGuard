[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
dynamic = ["version"]
description = "Explainable local phishing and scam-message risk analyzer"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Asim Ayaz"}]
keywords = ["phishing", "scam", "security", "education", "heuristics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "coverage[toml]>=7.5",
    "build>=1.2",
]

[project.scripts]
phishguard = "phishguard.cli:main"

[project.urls]
Homepage = "https://github.com/asimayazmrd0987-glitch/PhishGuard"
Source = "https://github.com/asimayazmrd0987-glitch/PhishGuard"
Changelog = "https://github.com/asimayazmrd0987-glitch/PhishGuard/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["phishguard"]
include-package-data = true

[tool.setuptools.package-data]
phishguard = ["py.typed"]

[tool.setuptools.data-files]
"share/phishguard/data" = [
    "data/risk_config.txt",
    "data/trusted_domains.txt",
    "data/sample_threats.txt",
    "data/suspicious_keywords.txt",
    "data/suspicious_phrases.txt",
    "data/suspicious_tlds.txt",
    "data/url_shorteners.txt",
    "data/known_tlds.txt",
    "data/public_suffixes.txt",
]

[tool.setuptools.dynamic]
version = {attr = "phishguard.version.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Conservative gate: syntax errors, undefined names and broken comparisons.
# The teaching code deliberately uses compact one-line branches, so style rules
# such as E701 are not enforced project-wide.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
files = ["phishguard"]
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["phishguard/ui.py"]

[tool.coverage.run]
source = ["phishguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
